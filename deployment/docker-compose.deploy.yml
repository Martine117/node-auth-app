name: auth-app-deploy

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the existing database password in the local .env}
      POSTGRES_DB: auth
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USERNAME:?Set your Docker Hub username}/auth-app:backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the existing database connection URL in the local .env}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME:?Set your Docker Hub username}/auth-app:frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
    external: true
    name: ${DB_VOLUME_NAME:-node-auth-app_db-data}
